#:schema https://mise.jdx.dev/schema/mise-task.json

[check]
description = "Build, then run tests, lint, and workflow checks concurrently"
alias = ["default", "all"]
run = "hk check --all"

[build]
description = "Build actionlint using the checked-in generated sources"
alias = "b"
env.CGO_ENABLED = "0"
run = "go build ./cmd/actionlint"

[test]
description = "Run all Go tests with the race detector on Unix"
alias = "t"
run = "go test -race ./..."
run_windows = "go test ./..."

["test:ci"]
description = "Run shuffled Go tests with coverage and report the results"
shell = "bash -c"
usage = '''
flag "--race <enabled>" default="true" help="Enable the Go race detector" {
    choices "true" "false"
}
'''
run = [
    'go test -race="${usage_race?}" -shuffle=on -count=1 -coverprofile=coverage.txt -covermode=atomic ./...',
    "go tool cover -func ./coverage.txt",
]

[lint]
description = "Run Go analysis, vulnerability checks, and documentation checks"
alias = "l"
tools.staticcheck = "2026.2.1"
run = [
    "go vet ./...",
    # Restrict staticcheck to project packages, excluding playground/node_modules.
    "staticcheck ./ ./scripts/... ./cmd/...",
    { task = "security" },
    { task = "lint:wasm" },
    "go run ./scripts/check-checks -quiet ./docs/checks.md",
    { task = "lint:markdown" },
]
run_windows = ["go vet ./...", "staticcheck ./ ./scripts/... ./cmd/...", { task = "security" }, { task = "lint:markdown" }]

["lint:markdown"]
description = "Lint Markdown using the repository's GitHub Flavored Markdown settings"
tools.rumdl = "0.2.73"
run = "rumdl check --deny-config-warnings ."

["format:markdown"]
description = "Apply Markdown formatting fixes"
tools.rumdl = "0.2.73"
run = "rumdl fmt --deny-config-warnings ."

[security]
description = "Check Go code for reachable vulnerabilities"
tools."go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
run = "govulncheck ./..."

["lint:shell"]
description = "Lint repository Bash scripts with ShellCheck"
run = "shellcheck ./scripts/*.bash ./.mise/tasks/download/test ./.mise/tasks/matcher/fixtures ./.mise/tasks/playground/deploy ./.mise/tasks/release/bump"

["lint:docker"]
description = "Lint the Dockerfile with Hadolint"
tools.hadolint = "2.15.1"
run = "hadolint --ignore DL3018 --strict-labels Dockerfile"

["lint:wasm"]
description = "Run staticcheck on the playground Wasm package"
tools.staticcheck = "2026.2.1"
env.GOOS = "js"
env.GOARCH = "wasm"
run = "staticcheck ./playground"

[workflows]
description = "Check repository workflows with the freshly built actionlint"
depends = ["build"]
run = "./actionlint"
run_windows = ".\\actionlint.exe"

[coverage]
description = "Generate coverage.out and coverage.html and print coverage totals"
alias = "cov"
run = [
    "go test -race -coverprofile coverage.out -covermode=atomic ./...",
    "go tool cover -html=coverage.out -o coverage.html",
    "go tool cover -func=coverage.out",
]
run_windows = [
    "go test -coverprofile coverage.out -covermode=atomic ./...",
    "go tool cover -html=coverage.out -o coverage.html",
    "go tool cover -func=coverage.out",
]

[bench]
description = "Run the Lint benchmarks"
run = "go test -bench Lint -benchmem"

[fuzz]
description = "Build and run a go-fuzz target (requires go-fuzz and go-fuzz-build)"
usage = 'arg "<function>" env="FUZZ_FUNC" help="Fuzz target, for example FuzzParse"'
run = [
    "go-fuzz-build ./fuzz",
    'go-fuzz -bin ./actionlint_fuzz-fuzz.zip -func "$usage_function"',
]
run_windows = [
    "go-fuzz-build ./fuzz",
    'go-fuzz -bin ./actionlint_fuzz-fuzz.zip -func "%usage_function%"',
]

[generate]
description = "Refresh generated Go sources from upstream data (requires network access)"
run = "go generate"

["generate:update"]
description = "Discover published action versions and refresh generated sources (requires Git and network access)"
run = [
    "go run ./scripts/generate-popular-actions -u -r ./scripts/generate-popular-actions/popular_actions.json",
    { task = "generate" },
]

["matcher:generate"]
description = "Regenerate the GitHub Actions problem matcher"
run = "bun ./scripts/generate-actionlint-matcher/main.mjs .github/actionlint-matcher.json"

["matcher:test"]
description = "Regenerate matcher fixtures and run the matcher tests"
depends = ["matcher:fixtures"]
run = "bun ./scripts/generate-actionlint-matcher/test.mjs"

["docs:man"]
description = "Generate the manpage and the playground's HTML manual"
alias = "man"
tools."go:github.com/cpuguy83/go-md2man/v2" = "2.0.7"
run = [
    "go-md2man -in man/actionlint.1.md -out man/actionlint.1",
    "go run ./scripts/generate-man-html man/actionlint.1.md man/actionlint.1.html",
]

["release:check"]
description = "Validate the release configuration without publishing"
tools.goreleaser = "2.18.1"
run = "goreleaser check"

["release:build"]
description = "Cross-compile snapshot binaries without publishing"
tools.goreleaser = "2.18.1"
run = "goreleaser build --snapshot --clean"

["release:snapshot"]
description = "Build snapshot archives and local container images without publishing (requires Docker Buildx)"
tools.goreleaser = "2.18.1"
depends = ["docs:man"]
run = "goreleaser release --snapshot --clean --skip=sign"

[release]
description = "Publish a tagged release (requires packaging tokens and cosign)"
tools.goreleaser = "2.18.1"
depends = ["docs:man"]
run = "goreleaser release --clean"

[changelog]
description = "Update CHANGELOG.md (requires changelog-from-release)"
run = "changelog-from-release > CHANGELOG.md"

[clean]
description = "Remove root build and fuzz output"
alias = "c"
run = [
    "rm -f ./actionlint ./actionlint.exe ./actionlint_fuzz-fuzz.zip ./man/actionlint.1 ./man/actionlint.1.html ./actionlint-workflow-ast",
    "rm -rf ./corpus ./crashers",
]

["playground:deps"]
description = "Install locked Bun dependencies"
dir = "playground"
run = "bun ci"

["playground:build"]
description = "Install dependencies and build the playground JavaScript and Wasm"
depends = ["playground:deps"]
dir = "playground"
run = [{ task = "playground:wasm" }, "bun run build"]

["playground:wasm"]
description = "Build the playground Wasm binary and prepare its Go runtime"
dir = "playground"
env.GOOS = "js"
env.GOARCH = "wasm"
run = [
    "go build -o dist/main.wasm",
    'cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./wasm_exec.js',
]

["playground:test"]
description = "Build the playground and run its tests"
depends = ["playground:build"]
dir = "playground"
run = "bun test"

["playground:ci"]
description = "Install locked Bun dependencies, build, lint, and test the playground"
dir = "playground"
run = [
    "bun ci",
    { task = "playground:wasm" },
    "bun run build",
    "bun run lint",
    "bun test",
]

["playground:lint"]
description = "Install playground dependencies and run its linters"
depends = ["playground:deps"]
dir = "playground"
run = "bun run lint"

["playground:serve"]
description = "Build and serve the playground at localhost:1234"
depends = ["playground:build"]
dir = "playground"
run = "bun run serve"

["playground:clean"]
description = "Remove generated playground files, retaining node_modules"
dir = "playground"
run = ["rm -f ./wasm_exec.js ./main.wasm ./index.js ./index.js.map", "rm -rf ./dist ./lib"]
