version: 2

release:
  draft: false
  prerelease: auto

before:
  hooks:
    - go mod download

builds:
  - <<: &build_defaults
      main: ./cmd/actionlint
      flags: [-trimpath]
      mod_timestamp: '{{ .CommitTimestamp }}'
      ldflags: -s -w -X github.com/matcra587/actionlint.version={{.Version}} -X "github.com/matcra587/actionlint.installedFrom=installed by downloading from release page"
      env:
        - CGO_ENABLED=0
    id: macos
    goos: [darwin]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: [386, arm, amd64, arm64]

  - <<: *build_defaults
    id: windows
    goos: [windows]
    goarch: [386, amd64, arm64]

  - <<: *build_defaults
    id: freebsd
    goos: [freebsd]
    goarch: [386, amd64]

checksum:
  name_template: "actionlint_{{.Version}}_checksums.txt"
  algorithm: sha256

archives:
  - <<: &archives_defaults
      files:
        - README.md
        - LICENSE.txt
        - docs
        - man/actionlint.1
    id: nix
    ids: [macos, linux, freebsd]
    formats: [tar.gz]
  - <<: *archives_defaults
    id: windows
    ids: [windows]
    formats: [zip]

homebrew_casks:
  - name: actionlint
    directory: Casks
    binaries: [actionlint]
    manpages: [man/actionlint.1]
    homepage: https://github.com/matcra587/actionlint#readme
    description: Static checker for GitHub Actions workflow files
    dependencies:
      - formula: shellcheck
    repository:
      owner: matcra587
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_GITHUB_TOKEN }}'
    commit_author:
      name: 'github-actions[bot]'
      email: '41898282+github-actions[bot]@users.noreply.github.com'

scoops:
  - name: actionlint
    directory: bucket
    homepage: https://github.com/matcra587/actionlint
    description: Static checker for GitHub Actions workflow files
    license: MIT
    repository:
      owner: matcra587
      name: scoop-bucket
      branch: main
      token: '{{ .Env.SCOOP_GITHUB_TOKEN }}'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

dockers_v2:
  - id: actionlint
    ids: [linux]
    images: [ghcr.io/matcra587/actionlint]
    tags:
      - '{{ .Version }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms: [linux/amd64, linux/arm64]
    sbom: '{{ not .IsSnapshot }}'
    flags:
      - '--provenance={{ if .IsSnapshot }}false{{ else }}mode=max{{ end }}'
    labels: &oci_metadata
      org.opencontainers.image.title: '{{ .ProjectName }}'
      org.opencontainers.image.description: Static checker for GitHub Actions workflow files
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.created: '{{ .CommitDate }}'
      org.opencontainers.image.source: https://github.com/matcra587/actionlint
      org.opencontainers.image.licenses: MIT
    annotations: *oci_metadata

signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sigstore.json'
    args: [sign-blob, '--yes', '--bundle=${signature}', '${artifact}']

docker_signs:
  - args: [sign, '--yes', '${artifact}@${digest}']

changelog:
  disable: true
