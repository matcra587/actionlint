#:schema https://mise.jdx.dev/schema/mise-task.json

[check]
description = "Build, test, lint, and check repository workflows in order"
alias = ["default", "all"]
run = "hk check --all"

[build]
description = "Build actionlint using the checked-in generated sources"
alias = "b"
env.CGO_ENABLED = "0"
run = "go build ./cmd/actionlint"

[test]
description = "Run all Go tests with the race detector on Unix"
alias = "t"
run = "go test -race ./..."
run_windows = "go test ./..."

[lint]
description = "Run Go analysis, vulnerability checks, and documentation checks"
alias = "l"
tools = { staticcheck = "2026.1", "go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0" }
run = [
    "go vet ./...",
    # Restrict staticcheck to project packages, excluding playground/node_modules.
    "staticcheck ./ ./scripts/... ./cmd/...",
    "govulncheck ./...",
    { task = "lint:wasm" },
    "go run ./scripts/check-checks -quiet ./docs/checks.md",
]
run_windows = ["go vet ./...", "staticcheck ./ ./scripts/... ./cmd/...", "govulncheck ./..."]

["lint:wasm"]
description = "Run staticcheck on the playground Wasm package"
tools.staticcheck = "2026.1"
env.GOOS = "js"
env.GOARCH = "wasm"
run = "staticcheck ./playground"

[workflows]
description = "Check repository workflows with the freshly built actionlint"
depends = ["build"]
run = "./actionlint"
run_windows = ".\\actionlint.exe"

[coverage]
description = "Generate coverage.out and coverage.html and print coverage totals"
alias = "cov"
run = [
    "go test -race -coverprofile coverage.out -covermode=atomic ./...",
    "go tool cover -html=coverage.out -o coverage.html",
    "go tool cover -func=coverage.out",
]
run_windows = [
    "go test -coverprofile coverage.out -covermode=atomic ./...",
    "go tool cover -html=coverage.out -o coverage.html",
    "go tool cover -func=coverage.out",
]

[bench]
description = "Run the Lint benchmarks"
run = "go test -bench Lint -benchmem"

[fuzz]
description = "Build and run a go-fuzz target (requires go-fuzz and go-fuzz-build)"
usage = 'arg "<function>" env="FUZZ_FUNC" help="Fuzz target, for example FuzzParse"'
run = [
    "go-fuzz-build ./fuzz",
    'go-fuzz -bin ./actionlint_fuzz-fuzz.zip -func "$usage_function"',
]
run_windows = [
    "go-fuzz-build ./fuzz",
    'go-fuzz -bin ./actionlint_fuzz-fuzz.zip -func "%usage_function%"',
]

[generate]
description = "Refresh generated Go sources from upstream data (requires network access)"
run = "go generate"

["matcher:generate"]
description = "Regenerate the GitHub Actions problem matcher"
run = "node ./scripts/generate-actionlint-matcher/main.mjs .github/actionlint-matcher.json"

["matcher:fixtures"]
description = "Regenerate matcher fixtures using the freshly built actionlint"
depends = ["build"]
# The colored fixture must contain ANSI escapes even in a noninteractive shell.
env.NO_COLOR = false
run = "bash ./scripts/generate-actionlint-matcher/fixtures.bash"

["matcher:test"]
description = "Regenerate matcher fixtures and run the matcher tests"
depends = ["matcher:fixtures"]
run = "node ./scripts/generate-actionlint-matcher/test.mjs"

["docs:man"]
description = "Generate the manual and its HTML version (requires ronn)"
alias = "man"
run = "ronn ./man/actionlint.1.ronn"

[changelog]
description = "Update CHANGELOG.md (requires changelog-from-release)"
run = "changelog-from-release > CHANGELOG.md"

[clean]
description = "Remove root build and fuzz output"
alias = "c"
run = [
    "rm -f ./actionlint ./actionlint.exe ./actionlint_fuzz-fuzz.zip ./man/actionlint.1 ./man/actionlint.1.html ./actionlint-workflow-ast",
    "rm -rf ./corpus ./crashers",
]

["playground:deps"]
description = "Install npm dependencies and copy playground assets"
depends = ["playground:npm"]
dir = "playground"
run = "bash ./post-install.bash"

["playground:npm"]
description = "Install playground npm dependencies when the package files change"
dir = "playground"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm install"

["playground:build"]
description = "Install dependencies and build the playground JavaScript and Wasm"
depends = ["playground:deps"]
dir = "playground"
run = ["npm run build", { task = "playground:wasm" }]

["playground:wasm"]
description = "Build the playground Wasm binary"
dir = "playground"
env.GOOS = "js"
env.GOARCH = "wasm"
run = "go build -o main.wasm"

["playground:test"]
description = "Build the playground and run its tests"
depends = ["playground:build"]
dir = "playground"
run = "npm test"

["playground:lint"]
description = "Install playground dependencies and run its linters"
depends = ["playground:deps"]
dir = "playground"
run = "npm run lint"

["playground:serve"]
description = "Build and serve the playground at localhost:1234"
depends = ["playground:build"]
dir = "playground"
run = "npm run serve"

["playground:clean"]
description = "Remove generated playground files, retaining node_modules"
dir = "playground"
run = ["rm -f ./main.wasm ./index.js ./index.js.map", "rm -rf ./lib"]
