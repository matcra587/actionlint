name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_LOCKED: '1'
  # Release tasks do not invoke local Git hooks.
  MISE_DISABLE_TOOLS: hk

jobs:
  binaries:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: deploy
    permissions:
      actions: read # Inspect checks on the tagged commit.
      contents: write # Publish GitHub release assets.
      packages: write # Publish and sign GHCR images.
      id-token: write # Obtain signing and attestation identities.
      attestations: write # Upload release provenance.
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        run: |
          source scripts/release/version.bash
          version="$(release_version "$GITHUB_REF_NAME")"
          if [[ "$(cat VERSION)" != "$version" ]]; then
            echo '::error::VERSION does not match the release tag'
            exit 1
          fi
          if [[ ! -s ".changes/${GITHUB_REF_NAME}.md" ]]; then
            echo '::error::Prepared release notes are missing or empty'
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases")"
          count="$(jq --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)] | length' <<< "$releases")"
          if ((count > 0)); then
            echo '::error::This release already exists; refusing to rebuild or replace published artifacts'
            exit 1
          fi
      - name: Wait for checks on the tagged commit
        uses: matcra587/github-actions/packages/await-gates@2340f3f78bb0853dbef8f6d80b97dd632bb06a65 # await-gates/v0.1.1
        with:
          gates: ci.yaml codeql.yaml
          ref: ${{ github.sha }}
      - name: Set up Go
        # @clover: constraint=major tags=setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Install mise tools
        # @clover: constraint=major tags=mise-action
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.10'
          install_args: --locked
          cache: false
          github_token: ${{ github.token }}
      - name: Install cosign
        # @clover: constraint=major tags=cosign-installer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Set up QEMU
        # @clover: constraint=major tags=setup-qemu-action
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        # @clover: constraint=major tags=setup-buildx-action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        # @clover: constraint=major tags=login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate release configuration
        run: mise run release:check
      - name: Check packaging credentials
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Configure APP_CLIENT_ID and APP_PRIVATE_KEY in the deploy environment before releasing'
            exit 1
          fi
      - name: Create packaging token
        id: packaging-token
        # @clover: constraint=major tags=create-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            homebrew-tap
            scoop-bucket
          permission-contents: write
      - name: Publish binaries, packages and container images
        run: mise run release:publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_TOKEN: ${{ steps.packaging-token.outputs.token }}
          SCOOP_GITHUB_TOKEN: ${{ steps.packaging-token.outputs.token }}
      - name: Attest release archives
        # @clover: constraint=major tags=attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ./dist/actionlint_${{ env.VERSION }}_checksums.txt
      - name: Check published download
        run: bash ./scripts/download-actionlint.bash "$VERSION"
