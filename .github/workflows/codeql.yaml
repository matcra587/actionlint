name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 21 * * 5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    permissions:
      contents: read
      security-events: write # Upload scanner results to code scanning.
    uses: matcra587/github-actions/.github/workflows/security.yml@d2ae464e93461998e97ebc72c4f3de40ac0a84df # security/v0.4.3
    with:
      # CI tests the fork's own actionlint; local CodeQL jobs preserve testdata exclusions.
      skip: actionlint codeql
      sarif: true
      zizmor-version: '1.30.1'
      zizmor-min-severity: low

  analyze-go:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload Go CodeQL results.
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        # @clover: constraint=major tags=setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Initialize CodeQL
        # @clover: constraint=major tags=codeql-action
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          config-file: ./.github/codeql/codeql-config.yaml
          languages: go
          build-mode: manual
      - name: Build Go sources
        run: |
          go build -v ./cmd/actionlint
          GOOS=js GOARCH=wasm go build -v -o ./playground/main.wasm ./playground
      - name: Analyze
        # @clover: constraint=major tags=codeql-action
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:go

  analyze-ts:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload TypeScript CodeQL results.
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        # @clover: constraint=major tags=codeql-action
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          config-file: ./.github/codeql/codeql-config.yaml
          languages: javascript-typescript
          build-mode: none
          source-root: ./playground
      - name: Analyze
        # @clover: constraint=major tags=codeql-action
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:javascript-typescript
