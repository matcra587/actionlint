name: Generate

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-*/**'
      - .github/workflows/generate.yaml
      - .github/actions/setup-linters/action.yml
      - .mise/tasks/tasks.toml
      - mise.toml
      - mise.lock
  schedule:
    - cron: '21 1 * * 6'
  workflow_dispatch:

permissions: {}

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  go-generate:
    name: Update generated data
    if: github.repository == 'matcra587/actionlint'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Update the generated-data branch.
      pull-requests: write # Open or update its pull request.
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: $/.github/actions/setup-linters
      - name: Refresh generated sources
        run: mise run generate:update
      - name: Validate generated sources
        run: mise run check
      - name: Update generated-data pull request
        # @clover: constraint=major tags=create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/generated-data
          delete-branch: true
          add-paths: |
            scripts/generate-popular-actions/popular_actions.json
            popular_actions.go
            availability.go
            all_webhooks.go
          commit-message: 'chore: update generated GitHub Actions data'
          title: 'chore: update generated GitHub Actions data'
          body: |
            Discover published action versions and refresh generated sources using `mise run generate:update`.
            Existing versions remain supported. Go tests and workflow validation passed before this update was proposed.
            Generated by [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          assignees: matcra587
