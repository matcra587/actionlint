name: Generate

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-*/**'
      - .github/workflows/generate.yaml
  schedule:
    - cron: '21 1 * * 6'
  workflow_dispatch:

permissions: {}

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  go-generate:
    name: Update generated data
    if: github.repository == 'matcra587/actionlint'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Update the generated-data branch.
      pull-requests: write # Open or update its pull request.
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Go
        # @clover: constraint=major tags=setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check new releases on GitHub
        run: go run ./scripts/generate-popular-actions -d
      - name: Refresh generated sources
        run: go generate
      - name: Update generated-data pull request
        # @clover: constraint=major tags=create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/generated-data
          delete-branch: true
          commit-message: 'chore: update generated GitHub Actions data'
          title: 'chore: update generated GitHub Actions data'
          body: |
            Refresh generated sources using `go generate`.
            Generated by [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          assignees: matcra587
