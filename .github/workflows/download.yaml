name: Download script

on:
  push:
    branches: [main]
    paths:
      - scripts/download-actionlint.bash
      - scripts/test-download-actionlint.bash
      - .github/workflows/download.yaml
  pull_request:
    paths:
      - scripts/download-actionlint.bash
      - scripts/test-download-actionlint.bash
      - .github/workflows/download.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download:
    name: Test download script
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test download script
        run: bash ./scripts/test-download-actionlint.bash
