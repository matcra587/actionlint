name: Download script

on:
  push:
    branches: [main]
    paths:
      - scripts/download-actionlint.bash
      - .mise/tasks/download/test
      - mise.toml
      - .github/workflows/download.yaml
  pull_request:
    paths:
      - scripts/download-actionlint.bash
      - .mise/tasks/download/test
      - mise.toml
      - .github/workflows/download.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download:
    name: Test download script
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        # @clover: constraint=major tags=mise-action
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.10'
          # The test only uses runner-provided Bash, curl and archive utilities.
          install: false
      - name: Test download script
        run: mise run --skip-tools download:test
